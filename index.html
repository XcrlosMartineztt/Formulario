<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calculadora</title>
        <!--Enlaza el html con el estilo de la página-->
        <link rel="stylesheet" href="./css/style.css">
    </head>
    <body>
                    <!--Contenedor de principal de la calculadora-->
            <div class="calculadora">
                    <!--Contenedor de pantalla de la calculadora mostrara los resultados-->
                 <div class="pantalla">0</div>
                    <!--Boton para borrar lo escrito en la calculadora-->
                 <button id="limpiar" class="boton">AC</button>  
                    <!--Boton para eliminar el ultimo numero escrito en calculadora-->
                 <button id="borrar" class="boton">←</button> 
                    <!--Botones de operaciones matematicas (/, *, +, -)-->
                    <!--Botones numericos (9-0)-->
                 <button id="division" class="boton">/</button> 
                 <button id="multiplicacion" class="boton">*</button> 
                 <button class="boton">7</button> 
                 <button class="boton">8</button> 
                 <button class="boton">9</button> 
                 <button id="resta" class="boton">-</button> 
                 <button class="boton">4</button> 
                 <button class="boton">5</button> 
                 <button class="boton">6</button> 
                 <button id="suma" class="boton">+</button> 
                 <button class="boton">1</button> 
                 <button class="boton">2</button> 
                 <button class="boton">3</button> 
                 <!--Boton para mostrar el resultado de la operacion matematica-->
                 <button id="igual" class="boton">=</button> 
                 <button id="cero" class="boton">0</button> 
                 <!--Boton de punto para los decimales-->
                 <button class="boton">.</button>                
            </div>
                <!--Enlaza el html con el archivo JS-->
        <script src="./script.js"></script>
    </body>
</html>
